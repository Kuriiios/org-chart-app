global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus monitors itself
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  # Nginx metrics via nginx-prometheus-exporter sidecar
  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']

