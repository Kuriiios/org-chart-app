server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA: route all unmatched paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nginx stub_status — scraped by nginx-prometheus-exporter
    # Allow Docker bridge (172.x.x.x), IPv4 loopback, and IPv6 loopback
    location /nginx_status {
        stub_status on;
        allow 172.0.0.0/8;
        allow 127.0.0.1;
        allow ::1;
        deny  all;
    }
}
