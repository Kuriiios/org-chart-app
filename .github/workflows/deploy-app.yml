name: Deploy App (Static Website)

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.*'
      - 'index.html'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload to Storage Account
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.APP_STORAGE_ACCOUNT }}
          AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
        run: |
          az storage blob upload-batch --source dist --destination \$web --account-name $AZURE_STORAGE_ACCOUNT --auth-mode login
